name: External Template Gate

on:
  pull_request:
    branches: [main]

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.3"

      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@3.2.3 --activate
          yarn --version

      - name: Scaffold from public repository
        run: |
          npx --yes create-scaffold-hbar@latest /tmp/rag-provenance-generated \
            --template sgagestudio/hedera-rag-provenance-template \
            --frontend nextjs-app \
            --solidity-framework hardhat \
            --network testnet \
            --skip-hedera-skills \
            --ci

      - name: Validate generated project
        working-directory: /tmp/rag-provenance-generated
        run: |
          yarn hardhat:compile
          yarn next:lint --max-warnings=0
          yarn next:check-types
          yarn next:build
