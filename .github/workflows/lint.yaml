name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: ["20.18.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Hardhat node and deploy contracts
        run: |
          for attempt in 1 2 3; do
            yarn hardhat:chain &
            chain_pid=$!
            if timeout 75s bash -c 'until curl -fsS -X POST http://127.0.0.1:8545 -H "Content-Type: application/json" --data "{\"jsonrpc\":\"2.0\",\"method\":\"web3_clientVersion\",\"params\":[],\"id\":1}" >/dev/null; do sleep 2; done' \
              && yarn hardhat:deploy --network localhost; then
              break
            fi
            kill "$chain_pid" 2>/dev/null || true
            wait "$chain_pid" 2>/dev/null || true
            if [ "$attempt" -eq 3 ]; then
              echo "Hedera fork/deploy failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Run nextjs lint
        run: yarn next:lint --max-warnings=0

      - name: Check typings on nextjs
        run: yarn next:check-types

      - name: Run hardhat lint
        run: yarn hardhat:lint --max-warnings=0
