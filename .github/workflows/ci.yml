name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.3"
          cache: yarn

      - run: corepack enable
      - run: yarn install --immutable
      - name: Reject high-severity npm advisories
        run: yarn npm audit --all --recursive --severity high
      - run: yarn hardhat:compile
      - name: Run Hedera-backed Hardhat tests
        run: |
          for attempt in 1 2 3; do
            if yarn hardhat:test; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - run: yarn next:test:provenance
      - run: yarn next:check-types
      - run: yarn next:build
