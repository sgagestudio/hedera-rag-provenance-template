services:
  ipfs:
    image: ipfs/kubo:v0.43.1
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "4001:4001/udp"
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
      - ipfs_staging:/export
    environment:
      IPFS_PROFILE: server

volumes:
  ipfs_data:
  ipfs_staging:
